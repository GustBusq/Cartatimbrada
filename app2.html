<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Relatórios LogTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-xl mx-4 my-8">
    <div class="flex items-center justify-center mb-6">
        <svg class="w-12 h-12 text-blue-600 mr-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
        </svg>
        <h1 class="text-4xl font-bold text-gray-800">Timbrada</h1>
    </div>

    <p class="text-center text-gray-600 mb-8">Gerador de cartas timbradas automático</p>

    <div id="search-section" class="space-y-4">
        <label for="id_pesquisa" class="block text-gray-700 font-semibold">🔍 Digite o ID que deseja pesquisar:</label>
        <input type="text" id="id_pesquisa" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: 12345">
        <button id="search-button" class="w-full p-3 bg-blue-600 text-white font-bold rounded-lg shadow-md hover:bg-blue-700 transition-colors">
            Buscar Viagem
        </button>
        <div id="status-message" class="text-center mt-4"></div>
    </div>

    <div id="results-section" class="hidden mt-8 space-y-6">
        <h2 class="text-2xl font-bold text-gray-800 border-b pb-2">Detalhes da Pesquisa</h2>
        <div id="trip-details" class="text-gray-700 space-y-2">
        </div>

        <h3 class="text-xl font-bold text-gray-800 pt-4">Itens Encontrados</h3>
        <div id="items-list" class="space-y-3">
        </div>

        <button id="generate-button" class="w-full p-3 bg-green-600 text-white font-bold rounded-lg shadow-md hover:bg-green-700 transition-colors">
            Gerar Documento(s)
        </button>
        <div id="generation-status" class="text-center mt-4"></div>
    </div>
</div>

<script>
    const searchSection = document.getElementById('search-section');
    const resultsSection = document.getElementById('results-section');
    const searchInput = document.getElementById('id_pesquisa');
    const searchButton = document.getElementById('search-button');
    const statusMessage = document.getElementById('status-message');
    const tripDetailsDiv = document.getElementById('trip-details');
    const itemsListDiv = document.getElementById('items-list');
    const generateButton = document.getElementById('generate-button');
    const generationStatusDiv = document.getElementById('generation-status');

    // Use a variável de ambiente fornecida pelo Render para a URL da API
    const API_URL = window.location.origin;

    let availableItems = []; // Array para armazenar os itens e seus valores

    // Lógica para o botão de BUSCA
    searchButton.addEventListener('click', async () => {
        const id_pesquisa = searchInput.value.trim();
        if (!id_pesquisa) {
            statusMessage.textContent = '⚠️ Por favor, digite um ID de pesquisa.';
            statusMessage.className = 'text-center mt-4 text-red-500 font-bold';
            return;
        }

        statusMessage.textContent = '⏳ Buscando dados...';
        statusMessage.className = 'text-center mt-4 text-blue-500 font-bold';
        resultsSection.classList.add('hidden');

        try {
            const response = await fetch(`${API_URL}/search_data`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id_pesquisa: id_pesquisa })
            });

            const data = await response.json();
            
            if (data.success) {
                statusMessage.textContent = '✅ Busca concluída!';
                statusMessage.className = 'text-center mt-4 text-green-600 font-bold';
                
                // Exibe os resultados na tela
                renderResults(data.trip_data, data.vehicle_data);
            } else {
                statusMessage.textContent = `❌ ${data.message || 'ID não encontrado ou erro na busca.'}`;
                statusMessage.className = 'text-center mt-4 text-red-600 font-bold';
            }
        } catch (error) {
            statusMessage.textContent = `❌ Erro de conexão com a API: ${error.message}`;
            statusMessage.className = 'text-center mt-4 text-red-600 font-bold';
        }
    });

    // Lógica para o botão de GERAR DOCUMENTO
    generateButton.addEventListener('click', async () => {
        const selectedItems = Array.from(document.querySelectorAll('input[name="item-checkbox"]:checked'))
                               .map(checkbox => checkbox.value);

        if (selectedItems.length === 0) {
            generationStatusDiv.textContent = '⚠️ Selecione pelo menos um item para gerar o documento.';
            generationStatusDiv.className = 'text-center mt-4 text-orange-500 font-bold';
            return;
        }

        // Mapeia os valores selecionados de volta para os índices que a API espera
        const escolha_str = selectedItems.join(',');

        generationStatusDiv.textContent = '⏳ Gerando documento(s)...';
        generationStatusDiv.className = 'text-center mt-4 text-blue-500 font-bold';
        
        try {
            const response = await fetch(`${API_URL}/generate_docs`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    id_pesquisa: searchInput.value.trim(),
                    escolha_str: escolha_str
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Erro ao gerar o documento.');
            }
            
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `Relatorio_${searchInput.value.trim()}.pdf`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);

            generationStatusDiv.textContent = '✅ Documento gerado e baixado com sucesso!';
            generationStatusDiv.className = 'text-center mt-4 text-green-600 font-bold';
        } catch (error) {
            generationStatusDiv.textContent = `❌ Erro: ${error.message}`;
            generationStatusDiv.className = 'text-center mt-4 text-red-600 font-bold';
        }
    });

    function renderResults(trip, vehicles) {
        tripDetailsDiv.innerHTML = `
            <p><span class="font-semibold">ID da Pesquisa:</span> ${trip.viagensLiberacaoId || 'N/A'}</p>
            <p><span class="font-semibold">Status:</span> ${trip.status || 'N/A'}</p>
            <p><span class="font-semibold">Cliente:</span> ${trip.cliente || 'N/A'}</p>
            <p><span class="font-semibold">Transportadora:</span> ${trip.transportadora || 'N/A'}</p>
        `;
        
        itemsListDiv.innerHTML = '';
        availableItems = [];

        // Monta a lista de itens disponíveis e seus valores
        if (trip.motorista) {
            availableItems.push({ label: `Motorista: ${trip.motorista}`, value: 'motorista' });
        }
        
        if (trip.veiculo && vehicles[trip.veiculo]) {
            availableItems.push({ label: `Placa: ${trip.veiculo}`, value: `placa:${trip.veiculo}` });
        }
        if (trip.reboque1 && vehicles[trip.reboque1]) {
            availableItems.push({ label: `Reboque 1: ${trip.reboque1}`, value: `placa:${trip.reboque1}` });
        }
        if (trip.reboque2 && vehicles[trip.reboque2]) {
            availableItems.push({ label: `Reboque 2: ${trip.reboque2}`, value: `placa:${trip.reboque2}` });
        }
        if (trip.reboque3 && vehicles[trip.reboque3]) {
            availableItems.push({ label: `Reboque 3: ${trip.reboque3}`, value: `placa:${trip.reboque3}` });
        }

        // Cria os checkboxes na interface
        availableItems.forEach((item, index) => {
            const checkboxDiv = document.createElement('div');
            checkboxDiv.className = 'flex items-center space-x-2';
            checkboxDiv.innerHTML = `
                <input type="checkbox" id="item-${index}" name="item-checkbox" value="${index+1}" class="rounded text-blue-600 focus:ring-blue-500 h-4 w-4">
                <label for="item-${index}" class="text-gray-700">${item.label}</label>
            `;
            itemsListDiv.appendChild(checkboxDiv);
        });

        // Exibe a seção de resultados
        resultsSection.classList.remove('hidden');
    }
</script>

</body>
</html>
